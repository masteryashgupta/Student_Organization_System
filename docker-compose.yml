version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: skyline_postgres
    restart: always
    environment:
      POSTGRES_DB: skyline_db
      POSTGRES_USER: skyline_user
      POSTGRES_PASSWORD: skyline_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
