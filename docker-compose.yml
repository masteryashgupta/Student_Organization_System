version: '3.8'

services:

  db:
    image: postgres:16-alpine
    container_name: skyline_postgres
    restart: always

    environment:
      POSTGRES_DB: skyline_db
      POSTGRES_USER: skyline_user
      POSTGRES_PASSWORD: skyline_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: skyline_pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skyline.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - db

    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
